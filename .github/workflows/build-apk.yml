name: Build Android APK (Free)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Create .env file for build
      run: |
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://dulakbeuaabrbzplqjti.supabase.co' }}" > .env
        echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1bGFrYmV1YWFicmJ6cGxxanRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTk4MTgsImV4cCI6MjEwNTkzNTgxOH0.AkDzeYzRre9Z2IRftPwGgvY6kuQ5BlF--S50z6U1EgU' }}" >> .env

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nosotros-MyEntik-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
